# Cross-compile sgl-kernel for RDNA2 gfx1030 and RDNA3 gfx1100.
# No GPU is required: hipcc in the public ROCm PyTorch image compiles the
# module when AMDGPU_TARGET is set. Runtime tests stay in
# scripts/rdna/smoke_qwen3_moe.sh.
#
# That image's hipcc is the pip SDK under _rocm_sdk_core, which does not
# ship rocThrust or hipSPARSE headers. scripts/rdna/prepare_pip_rocm_devel.sh
# installs the matching rocm-sdk-devel wheel and exports ROCM_HOME.

name: rdna-sgl-kernel

on:
  pull_request:
    paths:
      - "sgl-kernel/**"
      - "3rdparty/amd/sgl-kernel/**"
      - ".github/workflows/rdna-sgl-kernel.yml"
      - "scripts/rdna/prepare_pip_rocm_devel.sh"
  workflow_dispatch:

jobs:
  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Arch policy unit test
        run: python3 sgl-kernel/tests/test_rdna_targets.py

  compile:
    runs-on: ubuntu-latest
    needs: policy
    strategy:
      fail-fast: false
      matrix:
        arch: [gfx1030, gfx1100]
    steps:
      - uses: actions/checkout@v4
      - name: Compile sgl-kernel for ${{ matrix.arch }}
        run: |
          set -euo pipefail
          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/src" \
            -w /src/sgl-kernel \
            -e AMDGPU_TARGET=${{ matrix.arch }} \
            rocm/pytorch:rocm7.14.1_ubuntu24.04_py3.12_pytorch_release_2.12.0 \
            bash -c 'set -euo pipefail
              bash /src/scripts/rdna/prepare_pip_rocm_devel.sh
              # shellcheck disable=SC1091
              source /tmp/rdna-rocm-env.sh
              pip install ninja setuptools wheel
              python setup_rocm.py build_ext --inplace
              found=$(find python -name "common_ops*.so" -print)
              echo "$found"
              test -n "$found"'
